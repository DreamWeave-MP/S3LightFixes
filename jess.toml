manifest_version = 1

[package]
id = "org.dreamweave.s3lightfixes"
version = "0.1.0"
jess_api = "1"
default_target = "s3lightfixes"
include = ["src"]
tests = ["tests/run.jsl", "tests/cli.jsl", "tests/style.jsl"]

[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.load-order" = "0.1"
"org.dreamweave.openmw" = "0.1"

[modules]
"@s3lightfixes" = "src/init.jsl"
"@s3lightfixes/cli" = "src/cli.jsl"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. A run reads the load order's content files and lightconfig.toml,
# and writes the plugin, lightconfig.toml, and lightconfig.log, so its caller needs to read and
# write files.

[[layer]]
id = "s3lightfixes.core"
requires = ["tes3.core", "load-order.core", "openmw.core"]
exports = ["@s3lightfixes", "@s3lightfixes/cli"]

# The command line: `src/main.jsl` hands its arguments to `@s3lightfixes/cli`. A run reads the
# configuration, the data folders' listings, the content files, and lightconfig.toml
# (filesystem.read); writes S3LightFixes.omwaddon, lightconfig.toml, and lightconfig.log, removes
# the plugin it replaces, and with --auto-enable backs up and rewrites openmw.cfg
# (filesystem.write); and reads OPENMW_CONFIG when no flag names the configuration
# (process.environment). It runs no other program and opens no connection.

[targets.s3lightfixes]
kind = "command"
command = "s3lightfixes"
entry = "src/main.jsl"
capabilities = ["filesystem.read", "filesystem.write", "process.environment"]
