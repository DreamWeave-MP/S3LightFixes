name: Lightfixes CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
    tags: ['*']

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/rustGlobalBuild.yml@v52
    secrets: inherit
    with:
      # Required: JSON array of binary names to build. Add more for monorepos.
      binary_names: '["s3lightfixes"]'
      cargo_publish: false
      enable_portmaster: true
      enable_android: true
      # StroggForge records each release in content/home/mod.lock and deploys the documentation
      # site in content/, in place of rustdoc Pages.
      mod_template: true
